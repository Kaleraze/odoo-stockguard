[options]
addons_path = /mnt/extra-addons
db_host = db
db_port = 5432

; Database credentials are injected from the environment by the image entrypoint
; so that they never live in a file that is committed to git.

; The database manager (create / duplicate / drop / restore) is switched off, and
; the server answers for exactly one database. Together these remove the
; master-password attack surface entirely.
list_db = False
dbfilter = ^stockguard$

; Odoo sits behind a reverse proxy that terminates TLS and forwards the real
; client address.
proxy_mode = True

; Multi-process mode. Rule of thumb: (2 x CPU cores) + 1, and leave room for cron.
workers = 5
max_cron_threads = 2

limit_time_cpu = 120
limit_time_real = 240
limit_memory_soft = 1677721600
limit_memory_hard = 2013265920

log_level = warn
